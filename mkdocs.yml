site_name: 我的技术文档
site_url: https://wudanzhangsanfeng.github.io/my-docs/
repo_url: https://github.com/wudanzhangsanfeng/my-docs
repo_name: wudanzhangsanfeng/my-docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - 首页: index.md
  - 关于: about.md
  - 使用指南: guide.md
  - API参考: api.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - tables
